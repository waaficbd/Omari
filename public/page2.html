<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loan Application - Step 1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body { font-family: -apple-system, sans-serif; background-color: #EBF9F0; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .nav-header { width: 100%; background: linear-gradient(180deg, #00C853 0%, #00963F 100%); padding: 15px 20px; color: white; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .omari-logo { font-size: 24px; font-weight: bold; }
        .form-card { background: white; width: 92%; max-width: 480px; margin-top: 25px; padding: 30px 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,176,80,0.08); box-sizing: border-box; border: 1px solid #D4F1E0; }
        h2 { text-align: center; margin: 0; font-size: 26px; color: #1F2937; font-weight: 600; }
        .step-info { text-align: center; font-size: 15px; color: #6B7280; margin: 10px 0 25px; }
        .progress-box { display: flex; gap: 8px; margin-bottom: 35px; }
        .bar { height: 4px; flex: 1; background: #D4F1E0; border-radius: 2px; }
        .active-bar { background: #00B050; }
        .input-wrap { margin-bottom: 22px; }
        label { display: block; font-size: 16px; font-weight: 500; margin-bottom: 10px; color: #1F2937; }
        select, input, textarea { width: 100%; padding: 15px; border: 1px solid #B4E8C9; border-radius: 8px; font-size: 17px; box-sizing: border-box; background: #fff; }
        select:focus, input:focus, textarea:focus { border-color: #00B050; outline: none; }
        .btn-container { margin-top: 30px; display: flex; flex-direction: column; gap: 15px; }
        .back-btn { background-color: #F9FDFB; color: #6B7280; border: 1px solid #D4F1E0; padding: 16px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .next-btn { background: linear-gradient(180deg, #00C853 0%, #00963F 100%); color: white; border: none; padding: 18px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 8px rgba(0, 176, 80, 0.3); }
        .footer-text { text-align: center; font-size: 13px; color: #6B7280; margin-top: 40px; padding-bottom: 30px; }
    </style>
</head>

<body>

<div class="nav-header">
    <div onclick="goBack()" style="cursor:pointer; font-size:20px;">← Back</div>
    <div class="omari-logo">Omari Loans</div>
    <div style="font-size: 26px;">☰</div>
</div>

<div class="form-card">
    <h2>Loan Application</h2>
    <p class="step-info">Step 1 of 3</p>

    <div class="progress-box">
        <div class="bar active-bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <div class="input-wrap">
        <label>Loan Type</label>
        <select id="loanType">
            <option value="Personal Loan" selected>Personal Loan</option>
            <option value="Business Loan">Business Loan</option>
            <option value="Vehicle Loan">Vehicle Loan</option>
            <option value="Home Loan">Home Loan</option>
            <option value="Education Loan">Education Loan</option>
        </select>
    </div>

    <div class="input-wrap">
        <label>Loan Amount (USD)</label>
        <input type="text" id="loanAmount" readonly style="background:#F9FDFB">
    </div>

    <div class="input-wrap">
        <label>Loan Term</label>
        <input type="text" id="loanDuration" readonly style="background:#F9FDFB">
    </div>

    <div class="input-wrap">
        <label>Purpose of Loan</label>
        <textarea id="loanPurpose" rows="3" placeholder="What will you use the loan for?"></textarea>
    </div>

    <div class="btn-container">
        <button class="back-btn" onclick="goBack()">BACK</button>
        <button class="next-btn" onclick="goNext()">NEXT STEP</button>
    </div>
</div>

<div class="footer-text">© 2026 Omari Zimbabwe</div>

<script>
    function goNext() {
        const purposeEl = document.getElementById('loanPurpose');
        const typeEl = document.getElementById('loanType');
        const amountVal = document.getElementById('loanAmount').value;
        const durationVal = document.getElementById('loanDuration').value;

        if (!purposeEl || !typeEl) return;

        const purpose = purposeEl.value.trim();
        const type = typeEl.value;

        if (!purpose) {
            alert("Please fill in the purpose of the loan.");
            return;
        }

        localStorage.setItem('loanPurpose', purpose);
        localStorage.setItem('loanType', type);

        // Clean duration string (e.g., "12 months" becomes "12")
        const cleanDuration = durationVal.replace(/\D/g, ''); 
        
        // Calculate monthly (Amount * 1.18 interest / duration)
        const numericAmount = Number(amountVal.replace(/[^0-9.-]+/g,""));
        const monthly = ((numericAmount * 1.18) / Number(cleanDuration)).toFixed(2);

        localStorage.setItem('loan_amount', numericAmount);
        localStorage.setItem('loan_term', cleanDuration);
        localStorage.setItem('monthly_repayment', monthly);

        window.location.href = "page3.html";
    }

    function goBack() {
        window.location.href = "index.html";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }

        const amountEl = document.getElementById('loanAmount');
        const durationEl = document.getElementById('loanDuration');

        if (amountEl && durationEl) {
            const rawAmount = localStorage.getItem('amount') || "5000";
            amountEl.value = `$${Number(rawAmount).toLocaleString()}`;
            durationEl.value = String(localStorage.getItem('loanDuration') || "12 months");
        }
    };
</script>

</body>
</html>
